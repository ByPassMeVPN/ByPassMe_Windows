name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go_client/go.sum

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Validate routing configs
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python3 scripts/generate-test-configs.py
          python3 scripts/validate-routing-configs.py

      - name: Build installer
        shell: pwsh
        env:
          HUB_MOS_TOKEN: ${{ secrets.HUB_MOS_TOKEN }}
          GOTOOLCHAIN: auto
        run: |
          if (-not $env:HUB_MOS_TOKEN) { $env:HUB_MOS_TOKEN = '' }
          .\build-windows.ps1 -Configuration Release -HubMosToken $env:HUB_MOS_TOKEN -CreateInstaller

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = Get-ChildItem "dist\ByPassMe-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Установщик не найден" }
          Copy-Item $setup.FullName "dist\ByPassMe.exe" -Force
          $tag = "win-v$(Get-Date -Format 'yyyyMMddHHmm')"
          gh release create $tag `
            --title "ByPassMe Windows" `
            --notes "ByPassMe для Windows" `
            --latest `
            "dist\ByPassMe.exe"

      - name: Clean repository (keep README only)
        if: github.repository == 'ByPassMeVPN/ByPassMe_Windows'
        shell: pwsh
        run: |
          $lines = @(
            "Скачать последнюю версию ByPassMe для Windows:",
            "",
            "https://github.com/ByPassMeVPN/ByPassMe_Windows/releases/latest/download/ByPassMe.exe"
          )
          Set-Content -Path "$env:RUNNER_TEMP\README.md" -Value $lines -Encoding utf8NoBOM
          Get-ChildItem -Force . | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          Move-Item "$env:RUNNER_TEMP\README.md" "README.md"
          git config user.email "firstnameworst@gmail.com"
          git config user.name "firstnameworst"
          git add -A
          git commit -m "ByPassMe Windows [skip ci]"
          git push
